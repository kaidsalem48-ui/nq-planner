<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NQ Planner</title>
<meta name="description" content="Which days and hours to trade NQ, graded from the economic calendar.">
<meta name="theme-color" content="#0b0d11">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NQ Planner">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Dark trading-journal look: black ground, rounded tiles, green/red grade shades, purple holidays */
:root{
  --bg:#0b0d11; --panel:#15181e; --panel-2:#1c2028; --tile:#1f232b; --line:#262b35;
  --fg:#eef1f6; --muted:#8b93a3; --faint:#5d6574; --accent:#7b6cf6;
  --g2:#12a77f; --g2-fg:#f2fff9; --g1:#0f4d3d; --g1-fg:#45d6a2; --g0:#18302a; --g0-fg:#8cc4b0;
  --r1:#4d3b10; --r1-fg:#f7cd62; --r2:#e5484d; --r2-fg:#fff5f5;
  --hol:#5b3fd6; --hol-fg:#f3efff; --half:#35296f; --half-fg:#cfc4ff;
  --sg:#0f3b2f; --sg-line:#26c48d; --sg-fg:#9ff0cc;
  --sy:#3a2e12; --sy-line:#e7ac36; --sy-fg:#f8d790;
  --sr:#3b1a1d; --sr-line:#ef5b61; --sr-fg:#ffb2b5;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-block:14px 48px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;letter-spacing:.01em;padding:4px 8px 4px 4px;margin:-4px 0 -4px -4px;border-radius:10px;transition:background .12s}
.brand:hover{background:var(--panel-2)}
.brand img{width:30px;height:30px;border-radius:8px;transition:transform .5s}
.brand.spin img{transform:rotate(360deg)}
.upd{font-size:.72rem;color:var(--faint);text-align:right}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px}
.now{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.now .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.now .k{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.now .v{font-size:1.25rem;font-weight:800;min-width:0}
.now .n{font-size:.86rem;color:var(--muted)}
.pill{font-size:.78rem;font-weight:800;letter-spacing:.04em;padding:6px 11px;border-radius:10px;white-space:nowrap}
.pill.g{background:var(--sg);color:var(--sg-fg)}.pill.y{background:var(--sy);color:var(--sy-fg)}.pill.r{background:var(--sr);color:var(--sr-fg)}.pill.n{background:var(--panel-2);color:var(--muted)}

.ctl{padding:10px;display:flex;flex-direction:column;gap:10px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg3 button{padding:10px 0;border-radius:9px;font-weight:700;color:var(--muted);font-size:.98rem}
.seg3 button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.navrow{display:flex;align-items:center;gap:8px}
.btn{border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700;background:var(--panel)}
.arrow{width:38px;height:38px;border-radius:10px;font-size:1.3rem;color:var(--muted);display:grid;place-items:center}
.arrow:hover{background:var(--panel-2)}
.title{margin-left:auto;font-weight:700;font-size:1rem;border:1px solid var(--line);border-radius:10px;padding:8px 12px;white-space:nowrap}

.cal{padding:16px 12px 14px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px 14px;flex-wrap:wrap}
.calhead h2{margin:0;font-size:1.45rem;font-weight:800}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.cnt{font-size:.74rem;font-weight:800;padding:4px 8px;border-radius:8px}
.dow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:0 0 8px;text-align:center;font-size:.72rem;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tile{min-width:0;position:relative;height:74px;border-radius:12px;background:var(--tile);padding:7px 8px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;overflow:hidden;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .dn{align-self:flex-end;font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums}
.tile .tag{position:absolute;top:28px;left:6px;font-family:var(--f-mono);font-size:.54rem;font-weight:600;padding:1px 3px;border-radius:4px;background:rgba(0,0,0,.28);max-width:calc(100% - 12px);white-space:nowrap;overflow:hidden;text-overflow:clip}
.tile .lb.small{font-size:.74rem}
.tile .lb{font-size:.86rem;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.empty{background:transparent;border:1px dashed var(--line);color:var(--faint)}
.tile.past{opacity:.45}
.tile.today{box-shadow:0 0 0 2px var(--fg)}
.s2{background:var(--g2);color:var(--g2-fg)}.s1{background:var(--g1);color:var(--g1-fg)}.s0{background:var(--g0);color:var(--g0-fg)}
.s-1{background:var(--r1);color:var(--r1-fg)}.s-2{background:var(--r2);color:var(--r2-fg)}
.shol{background:var(--hol);color:var(--hol-fg)}.shalf{background:var(--half);color:var(--half-fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:12px 4px 0}
.legend span{font-size:.72rem;font-weight:700;padding:4px 8px;border-radius:8px}

/* week + day boxes */
.wk .grid5{grid-template-columns:1fr;gap:8px}
.wk .tile{aspect-ratio:auto;min-height:0;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:2px 14px;align-items:center}
.wk .tile .tag{position:static;grid-column:2;grid-row:1;justify-self:end;background:rgba(0,0,0,.28);max-width:none;font-size:.66rem}
.wk .tile .dn{grid-column:1;grid-row:1/3;align-self:center;font-size:1rem;font-weight:800;text-align:center;line-height:1.1}
.wk .tile .body{grid-column:2;grid-row:2;min-width:0}
@media (min-width:700px){.wk .grid5{grid-template-columns:repeat(5,minmax(0,1fr))}.wk .tile{display:flex;flex-direction:column;min-height:130px}.wk .tile .tag{position:absolute}.wk .tile .dn{align-self:flex-end}}
.wk .tile .lb{font-size:1.05rem;white-space:normal}
.wk .tile .sub{font-size:.76rem;font-weight:600;opacity:.85;line-height:1.25;margin-top:2px}
.daybox{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.daybox .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.daybox h3{margin:0;font-size:1.6rem;font-weight:800;line-height:1.1}
.daybox .dt{font-weight:700;opacity:.85}
.daybox .why{margin:0;font-size:.9rem;font-weight:600;opacity:.92}
.newsl{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.newsl li{display:flex;gap:8px;font-size:.86rem;align-items:baseline}
.newsl .t{font-family:var(--f-mono);font-size:.74rem;font-weight:600;min-width:40px}
.newsl .ip{width:8px;height:8px;border-radius:2px;flex:none;transform:translateY(-1px)}
.windows{display:flex;flex-direction:column;gap:6px;padding:14px;margin:0;list-style:none}
.windows li{display:grid;grid-template-columns:112px 1fr;gap:10px;align-items:center;font-size:.88rem}
.windows .t{font-family:var(--f-mono);font-size:.74rem;font-weight:600;padding:3px 7px;border-radius:6px;text-align:center;font-variant-numeric:tabular-nums}
.t.g{background:var(--sg);color:var(--sg-fg)}.t.y{background:var(--sy);color:var(--sy-fg)}.t.r{background:var(--sr);color:var(--sr-fg)}
.notes{font-size:.82rem;color:var(--muted);margin:0;padding:0 2px}

.expand{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);font-weight:800;font-size:.95rem}
.expand .chev{transition:transform .2s}
.expand[aria-expanded="true"] .chev{transform:rotate(180deg)}

/* hour timeline */
.tl{padding:0 0 10px;overflow-x:auto}
.tgrid{display:grid;grid-template-columns:52px repeat(var(--cols),minmax(var(--colmin),1fr))}
.th{position:sticky;top:0;z-index:3;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 4px;text-align:center;font-weight:800;font-size:.9rem}
.th small{display:block;font-family:var(--f-mono);font-size:.62rem;color:var(--muted);font-weight:500}
.th.today{color:#b4abff}
.axis{position:relative;border-right:1px solid var(--line)}
.axis span{position:absolute;right:6px;transform:translateY(-50%);font-family:var(--f-ui);font-weight:700;font-size:.74rem;color:var(--muted);white-space:nowrap}
.axis span.o{color:var(--fg);font-weight:600}
.colx{position:relative;border-right:1px solid var(--line)}
.colx:last-child{border-right:0}
.hl{position:absolute;left:0;right:0;border-top:1px solid #1f242d}
.hl.o{border-top:1px dashed #4a5262}
.sg{position:absolute;left:3px;right:3px;border-radius:6px;padding:3px 6px;overflow:hidden;border-left:3px solid;display:flex;flex-direction:column;gap:1px}
.sg.g{background:var(--sg);border-color:var(--sg-line);color:var(--sg-fg)}
.sg.y{background:var(--sy);border-color:var(--sy-line);color:var(--sy-fg)}
.sg.r{background:var(--sr);border-color:var(--sr-line);color:var(--sr-fg)}
.sg .st{font-family:var(--f-mono);font-size:.6rem;font-weight:600;white-space:nowrap}
.sg .sn{font-size:.66rem;line-height:1.2;font-weight:600}
.sg.tiny{padding:0 6px;justify-content:center}.sg.tiny .sn{display:none}.sg.micro .st{display:none}
.mk{position:absolute;left:0;right:0;z-index:2;height:0;pointer-events:none}
.mk::before{content:"";position:absolute;left:0;right:0;top:-1px;border-top:2px solid #e9ecf2}
.mk.minor::before{border-top:2px dashed #9aa3b3}
.mk.time::before{border-top:2px dotted var(--accent)}
.mk b{position:absolute;right:3px;top:-9px;font-family:var(--f-mono);font-size:.56rem;font-weight:600;background:#e9ecf2;color:#0b0d11;padding:1px 4px;border-radius:4px;white-space:nowrap;max-width:calc(100% - 6px);overflow:hidden;text-overflow:ellipsis}
.mk.minor b{background:#9aa3b3}.mk.time b{background:var(--accent);color:#fff}
.nl{position:absolute;left:0;right:0;z-index:2;border-top:2px solid #b4abff}
.nl::before{content:"";position:absolute;left:-3px;top:-5px;width:8px;height:8px;border-radius:50%;background:#b4abff}
.pre{position:absolute;left:0;right:0;top:0;border-bottom:1px dashed var(--line)}

.dlist{display:flex;flex-direction:column;gap:6px;padding:12px 12px 14px 8px}
.drow{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:stretch;position:relative}
.drow::before{content:"";position:absolute;left:62px;right:0;top:0;border-top:1px dashed var(--line)}
.dtime{font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;line-height:1.05;padding-top:4px;display:flex;flex-direction:column;align-items:flex-end}
.dtime small{font-size:.66rem;font-weight:700;color:var(--muted);letter-spacing:.06em}
.dsec{font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 0 2px 68px}
.dend{align-items:center}.dendl{font-size:.8rem;color:var(--faint);padding-top:4px}
.dbox{min-width:0;margin-top:4px;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;border-left:5px solid}
.dtop{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 10px}
.drng{font-size:1.32rem;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--fg)}
.drng small{font-size:.8rem;font-weight:700;opacity:.75;margin-left:1px}
.dbox.g{background:var(--sg);border-color:var(--sg-line);color:var(--sg-fg)}
.dbox.y{background:var(--sy);border-color:var(--sy-line);color:var(--sy-fg)}
.dbox.r{background:var(--sr);border-color:var(--sr-line);color:var(--sr-fg)}
.dbox,.sg{cursor:pointer}
.dbox:active{transform:scale(.99)}
.dbox.live{box-shadow:0 0 0 2px #b4abff}
.dst{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.dre{font-size:1.02rem;font-weight:700;line-height:1.3}
.dms{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.chipm{font-family:var(--f-mono);font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:6px;background:#e9ecf2;color:#0b0d11}
.chipm.minor{background:#9aa3b3}.chipm.time{background:var(--accent);color:#fff}
.tile{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.tile:has(.a8) .lb{padding-right:16px}
.a8{position:absolute;right:6px;bottom:6px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:.66rem;font-weight:800;background:#26c48d;color:#03140d;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.shc{width:100%;max-width:520px;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.shc p{margin:0;font-size:.95rem;font-weight:600;line-height:1.45}
.shh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.shh b{font-size:1.4rem;font-weight:800}.shh span{font-weight:700;opacity:.85}
.shb{display:flex;gap:8px;margin-top:6px}.shb .btn{flex:1;background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.15);color:inherit}
.foot{font-size:.74rem;color:var(--faint);display:flex;flex-direction:column;gap:4px;padding:0 4px}
.foot p{margin:0}
.err{padding:18px;color:var(--r1-fg)}
/* phones: long labels wrap onto two lines instead of running out of the tile */
@media (max-width:639px){
  .cal .tile .lb{white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .cal .tile .lb.small{font-size:.7rem;line-height:1.05}
  .cal .tile .tag{text-overflow:ellipsis}
  .cal .tile.election .tag{top:24px;white-space:normal;line-height:1;max-height:20px;text-overflow:clip}
  .cal .tile:has(.a8) .lb{padding-right:0}
  .cal .tile .a8{right:auto;bottom:auto;left:6px;top:6px;width:16px;height:16px;font-size:.6rem}
}
@media (min-width:640px){.tile{height:92px}.tile .lb,.tile .lb.small{font-size:1rem}.tile .tag{font-size:.64rem;top:8px;left:8px;max-width:calc(100% - 40px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== layout shell: mobile keeps the single column ===== */
.side,.mainp{display:contents}
.mini,.brk,.win,.dk-only{display:none}

/* ===== desktop ===== */
@media (min-width:1100px){
  body{height:100vh;overflow:hidden}
  .wrap{max-width:none;height:100vh;display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;padding:16px;margin:0}
  .side{display:flex;flex-direction:column;gap:14px;min-height:0;overflow-y:auto;padding-right:2px}
  .mainp{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 20px 12px}
  .top{padding:4px 6px 0}
  .mini,.brk{display:flex;flex-direction:column;gap:10px;padding:16px}
  .win{display:block}
  .dk-only{display:block}

  /* header row: title left, view switch center, nav right */
  .ctl{flex-direction:row;align-items:center;gap:16px;padding:0;background:none;border:0}
  .ctl .seg3{width:330px;order:1;margin:0 auto}
  .navrow{display:contents}
  .title{order:0;border:0;padding:0;margin:0;font-size:1.7rem;font-weight:800;min-width:260px}
  #today{order:3}#prev{order:2}#next{order:4}
  #view{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px}
  .foot{font-size:.7rem;flex-direction:row;gap:14px;flex-wrap:wrap}

  /* month fills the panel */
  .cal{flex:1;display:flex;flex-direction:column;min-height:0;background:none;border:0;padding:0}
  .cal .grid5{flex:1;grid-auto-rows:minmax(96px,1fr);gap:10px}
  .cal .tile{height:auto;padding:12px 14px}
  .cal .tile .dn{font-size:1.05rem}
  .cal .tile .tag{top:12px;left:14px;font-size:.7rem;max-width:calc(100% - 60px)}
  .cal .tile .lb,.cal .tile .lb.small{font-size:1.25rem}
  .cal .tile .win{font-size:.74rem;font-weight:600;opacity:.85;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal .tile .a8{right:12px;bottom:12px;width:22px;height:22px;font-size:.78rem}
  .calhead{display:none}
  .dow{gap:10px}

  /* desktop sheet = popover */
  .sheet.pop{background:rgba(0,0,0,.25);display:block;padding:0}
  .sheet.pop .shc{position:absolute;width:380px;max-width:none;cursor:grab;touch-action:none;user-select:none}
  .sheet.pop .shc.drag{cursor:grabbing}
  .sheet.pop .shc .btn{cursor:pointer}
}

/* ===== desktop schedule grid ===== */
.wg{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
.wg-head{display:grid;grid-template-columns:64px repeat(var(--cols),minmax(0,1fr));gap:8px;padding-bottom:10px}
.wg-dh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:12px;background:var(--panel-2);border:1px solid transparent;text-align:left;min-width:0}
.wg-dh .d1{font-weight:800;font-size:1.05rem;white-space:nowrap}
.wg-dh .d1 small{font-size:.72rem;font-weight:700;color:var(--muted);margin-left:6px;letter-spacing:.06em}
.wg-dh.today{border-color:var(--fg)}
.wg-dh .gp{font-size:.66rem;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:999px;white-space:nowrap}
.wg-tz{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);align-self:center}
.wg-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.wg-grid{display:grid;grid-template-columns:64px repeat(var(--cols),minmax(0,1fr));gap:8px;position:relative}
.wg-ax{position:relative}
.wg-ax span{position:absolute;left:0;transform:translateY(-50%);font-size:.8rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wg-ax span.o{color:var(--fg)}
.wg-col{position:relative;border-radius:12px}
.wg-line{position:absolute;left:-8px;right:-8px;border-top:1px solid var(--line-2)}
.wg-line.o{border-top:1px dashed #4a5262}
.wb{position:absolute;left:0;right:0;border-radius:12px;padding:8px 11px;overflow:hidden;display:flex;flex-direction:column;gap:3px;cursor:pointer;border:1px solid transparent;transition:filter .12s,transform .12s}
.wb:hover{filter:brightness(1.15)}
.wb:active{transform:scale(.99)}
.wb.g{background:var(--sg);color:var(--sg-fg);border-color:rgba(38,196,141,.35)}
.wb.y{background:var(--sy);color:var(--sy-fg);border-color:rgba(231,172,54,.35)}
.wb.r{background:var(--sr);color:var(--sr-fg);border-color:rgba(239,91,97,.3)}

<body>
<div class="wrap">
 <aside class="side">
  <div class="top">
    <button class="brand" id="brand" title="Refresh for the latest schedule"><img src="icon.png" alt="">NQ Planner</button>
    <div class="upd" id="upd"></div>
  </div>

  <section class="panel now" id="now" aria-live="polite"></section>
  <section class="panel mini" id="mini"></section>
  <section class="panel brk" id="brk"></section>
  <section class="panel brk" id="upn"></section>
 </aside>
 <section class="mainp">

  <section class="panel ctl">
    <div class="seg3" role="group" aria-label="View">
      <button id="v-month" aria-pressed="true">Month</button>
      <button id="v-week" aria-pressed="false">Week</button>
      <button id="v-day" aria-pressed="false">Day</button>
    </div>
    <div class="navrow">
      <button class="btn" id="lst" aria-pressed="false">Show list</button>
      <button class="btn" id="today">Today</button>
      <button class="arrow" id="prev" aria-label="Previous">&#8249;</button>
      <button class="arrow" id="next" aria-label="Next">&#8250;</button>
      <span class="title" id="title"></span>
    </div>
  </section>

  <div id="condition-host"></div>
  <main id="view"></main>
  <div class="sheet" id="sheet" hidden></div>

  <footer class="foot" id="foot"></footer>
 </section>
</div>

<script>
(() => {
  const T0 = 120, T8 = 480, T1 = 960;
  const LABEL_CLASS = s => s == null ? "shol" : "s" + s;
  const DOW = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
  const MON = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
  const toMin = s => { const [h,m] = s.split(":").map(Number); return h*60+m; };
  const fmt = m => { let h = Math.floor(m/60) % 24, mm = m%60; const ap = h >= 12 ? "p" : "a"; h = h%12 || 12; return h + (mm ? ":" + String(mm).padStart(2,"0") : "") + ap; };
  const fmtR = (a,b) => fmt(a) + "–" + fmt(b);
  const D = iso => new Date(iso + "T12:00:00Z");
  const iso = d => d.toISOString().slice(0,10);
  const addDays = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate()+n); return iso(d); };
  const monday = s => { const d = D(s); const w = d.getUTCDay(); d.setUTCDate(d.getUTCDate() - ((w+6)%7)); return iso(d); };
  const short = s => { const d = D(s); return MON[d.getUTCMonth()].slice(0,3) + " " + d.getUTCDate(); };
  const dow = s => DOW[D(s).getUTCDay()];

  function nyNow(){
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()).map(x => [x.type,x.value]));
    return { date: `${p.year}-${p.month}-${p.day}`, min: (Number(p.hour)%24)*60 + Number(p.minute) };
  }
  let NOW = nyNow();

  let DATA, BY = {}, view = "month", cursor = NOW.date, listMode = false;
  let expanded = false; try { expanded = localStorage.getItem("nq-expanded") === "1"; } catch (e) {}
  const setExpanded = v => { expanded = v; try { localStorage.setItem("nq-expanded", v ? "1" : "0"); } catch (e) {} };


  let NOTES={};try{NOTES=JSON.parse(localStorage.getItem('nq-market-conditions-v1')||'{}');}catch{}
  let AUTO_CONDITIONS = {days:{}}, autoRecordingStatus = "Loading daily recordings…";
  const marketRecord = day => ({...(AUTO_CONDITIONS.days?.[day]?.values || {}), ...(NOTES['day:'+day] || {})});
  function recordingInfo(day) {
    const record=AUTO_CONDITIONS.days?.[day];
    const manual=Object.keys(NOTES['day:'+day]||{}).some(k=>k.startsWith('mc')||k==='marketGapPoints');
    if(!record)return `${esc(autoRecordingStatus)}<br>Daily recording: weekdays at 8:00 AM New York. Manual edits stay on this device.`;
    return `Daily snapshot recorded ${esc(stampNY(Date.parse(record.recordedAt)))}. Source times are listed below; this is not a live feed.${manual?' Your manual edits take priority.':''}<details><summary>Recorded sources &amp; times</summary><ul>${(record.sources||[]).filter(s=>/^https:\/\//i.test(s.url)).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a> · as of ${esc(stampNY(Date.parse(s.asOf)))}</li>`).join('')||'<li>No verified values available for this session.</li>'}</ul></details>`;
  }
  const ui={marketOpen:false},localNoteEdits=new Map(),saveUi=()=>{},stampNY=ms=>new Date(ms).toLocaleString('en-US',{timeZone:'America/New_York'} )+' NY';
  const wd=day=>D(day).getUTCDay();let marketBase={};
  const saveNote=async(k,value)=>{const next={...NOTES,[k]:{...(NOTES[k]||{}),...value}};localStorage.setItem('nq-market-conditions-v1',JSON.stringify(next));NOTES=next;localNoteEdits.set(k,Date.now());};
  function applyMarketConditions(){for(const [day,base] of Object.entries(marketBase)){const d=BY[day]=JSON.parse(JSON.stringify(base)),a=marketAssessment(day);if(a.expiry){d.opex=true;d.expiryLabel=a.expiry;d.quadWitching=a.expiry==='Quad witching';d.opexRule=a.plan;}else if((NOTES['day:'+day]||{}).mcExpiry==='None'){/* Schedule's established OPEX restriction remains; an override never removes a news restriction. */}
    if(a.level==='Reduced'&&!['closed','bank'].includes(d.holidayType)){d.score=Math.min(d.score,-1);d.label=d.score===-2?'Sit out':'Light';d.segs=d.segs.map(s=>s[2]==='g'?[s[0],s[1],'y',s[3]+' · market conditions: reduce aggression']:s);d.asia=(d.asia||[]).map(s=>s[2]==='g'?[s[0],s[1],'y',s[3]+' · market conditions: reduce aggression']:s);d.why+=' '+[...a.reasons,a.plan].join(' ');}}
  }
  // Dated observations, saved in the same private, field-merged day records as notes.
  function scheduledExpiry(day){
    const y=+day.slice(0,4),m=+day.slice(5,7),first=`${y}-${String(m).padStart(2,'0')}-01`;
    let date=addDays(first,(5-wd(first)+7)%7+14);
    // Good Friday and the observed Juneteenth holiday can move a third-Friday expiry.
    const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,n=Math.floor((a+11*h+22*l)/451),em=Math.floor((h+l-7*n+114)/31),ed=(h+l-7*n+114)%31+1;
    const goodFriday=addDays(`${y}-${String(em).padStart(2,'0')}-${String(ed).padStart(2,'0')}`,-2),juneteenth=`${y}-06-19`,observedJune=wd(juneteenth)===6?addDays(juneteenth,-1):wd(juneteenth)===0?addDays(juneteenth,1):juneteenth;
    for(let j=0;j<7&&(wd(date)===0||wd(date)===6||date===goodFriday||y>=2022&&date===observedJune||BY[date]?.holidayType==='closed');j++)date=addDays(date,-1);
    return day===date?([3,6,9,12].includes(m)?'Quad witching':'OPEX'):'';
  }
  function expiryForDay(day){const override=marketRecord(day).mcExpiry;return override==='None'?'':override||scheduledExpiry(day);}
  const marketNum=(n,k)=>n[k]!==''&&n[k]!=null&&Number.isFinite(+n[k])?+n[k]:null;
  const TECH_NAMES=['AAPL','MSFT','NVDA','AMZN','GOOGL','META','TSLA'];
  function techBreadth(n){
    const names=TECH_NAMES.filter(k=>marketNum(n,'mc'+k)!=null),direction=n.mcDirection;
    if(!['Up','Down'].includes(direction)||names.length!==7)return {label:n.mcBreadth||'Not recorded',detail:`${names.length}/7 tech moves recorded. Enter all seven and NQ direction for a participation tally.`};
    const aligned=names.filter(k=>direction==='Up'?+n['mc'+k]>0:+n['mc'+k]<0),opposed=names.filter(k=>direction==='Up'?+n['mc'+k]<0:+n['mc'+k]>0);
    return {label:n.mcBreadth||(aligned.length>=5?'Broad participation':opposed.length>=4?'Divergent':'Narrow / mixed'),detail:`${aligned.length}/7 align with NQ ${direction.toLowerCase()}; ${opposed.length} oppose. ${opposed.length?'Opposing: '+opposed.join(', ')+'.':''} Equal-count check; not index-weighted contribution.`};
  }
  function marketAssessment(day){
    const n=marketRecord(day),expiry=expiryForDay(day),vix=marketNum(n,'mcVix'),overnight=marketNum(n,'mcOvernight'),breadth=techBreadth(n),reasons=[],watch=[];
    if(expiry)reasons.push(expiry==='Quad witching'?'Quad witching: overlapping expiries may bring repositioning and unusual volume.':'OPEX: your lower-probability rule applies.');
    if(overnight!=null&&Math.abs(overnight)>200)reasons.push(`Overnight move ${overnight>0?'+':''}${overnight} pts exceeds your 200-point rule: expect potentially poor price action.`);
    if(vix!=null&&vix>18&&n.mcVol==='Expanding')reasons.push('VIX above 18 and expanding: reduce aggression while volatility accelerates.');
    else if(vix!=null)watch.push(`VIX ${vix}: ${vix>18?'above':vix<18?'below':'at'} your 18 threshold${n.mcVol?' · '+n.mcVol.toLowerCase():''}. Below 18 is not an automatic green light.`);
    if(['Divergent','Narrow / mixed','Narrow participation'].includes(breadth.label))reasons.push('Tech participation is narrow or divergent: NQ strength may lack broad support.');
    if(n.mcMacro==='Headwinds')reasons.push('You marked yields / dollar as headwinds to your setup.');
    if(n.mcRebalance==='Confirmed')reasons.push('Confirmed index rebalance: monitor flow and the closing auction.');
    if(n.mcRebalance==='Possible')watch.push('Possible rebalance: confirm the index announcement; expiry alone does not establish a rebalance.');
    if(n.mcGamma==='Short gamma')watch.push('Short gamma observation: dealer hedging can reinforce moves in either direction; avoid assuming stability.');
    if(n.mcGamma==='Long gamma')watch.push('Long gamma observation: dealer hedging can oppose moves; monitor pinning and failed extensions.');
    if(n.mcGamma==='Mixed / near flip')watch.push('Gamma near a flip: hedging behavior may change as price crosses your recorded level.');
    if(n.marketType==='Reversal')watch.push('Current session reversed: reassess continuation assumptions and gap behavior.');
    if(n.mcOvernightType==='Reversal'||n.mcPositioning==='Crowded longs'||n.mcPositioning==='Crowded shorts')watch.push('Overnight reversal or crowded positioning: watch for trapped inventory and failed continuation.');

  function step(n){
    if (listMode) cursor = addDays(monday(cursor), 7*n);

    else if (view === "week") cursor = addDays(monday(cursor), 7*n);

  function placePop(r){

    // centre the card over the block it explains, kept inside the window

  function dragPop(card){
    card.onpointerdown = e => {

      card.setPointerCapture(e.pointerId); card.classList.add("drag");
      card.onpointermove = m => {

    };
  }

    sh.onclick = e => { if (e.target === sh) sh.hidden = true; };
  }
  function bindTiles(){
    $("view").querySelectorAll(".tile[data-d]").forEach(b => {
      let timer = null, long = false;
      const start = () => { long = false; timer = setTimeout(() => { long = true; explain(b.dataset.d); }, 450); };
      const stop = () => clearTimeout(timer);
      b.addEventListener("pointerdown", start);
      ["pointerup","pointerleave","pointercancel"].forEach(ev => b.addEventListener(ev, stop));
      b.addEventListener("contextmenu", e => e.preventDefault());
      b.onclick = e => { if (long) { e.preventDefault(); return; } cursor = b.dataset.d; view = "day"; render(); };
    });
  }

  /* ---------- month ---------- */
  function renderMonth(){
    const d = D(cursor); const y = d.getUTCFullYear(), m = d.getUTCMonth();
    $("title").textContent = MON[m] + " " + y;
    const first = iso(new Date(Date.UTC(y, m, 1, 12)));
    let start = monday(first);
    const lastDay = new Date(Date.UTC(y, m+1, 0, 12));
    const days = []; let cnt = {};
    for (let s = start; D(s) <= lastDay || D(s).getUTCDay() !== 1; s = addDays(s,1)) {
      const wd = D(s).getUTCDay(); if (wd === 0 || wd === 6) continue;
      days.push(s);
      const dd = BY[s]; if (dd && D(s).getUTCMonth() === m) { const k = dayLabel(dd); cnt[k] = (cnt[k]||0)+1; }
      if (days.length > 40) break;
    }
    const order = [["Great","s2"],["Good","s1"],["OK","s0"],["Light","s-1"],["Sit out","s-2"],["Markets open","shol"],["Markets closed","shol"]];
    const counts = order.filter(([k]) => cnt[k]).map(([k,c]) => `<span class="cnt ${c}">${cnt[k]} ${k}</span>`).join("");
    const tiles = days.map(s => {
      const dd = BY[s], inMonth = D(s).getUTCMonth() === m;
      if (!inMonth) return `<div class="tile empty"><span class="dn">${D(s).getUTCDate()}</span><span></span></div>`;
      if (!dd) return `<div class="tile"><span class="dn">${D(s).getUTCDate()}</span><span class="lb" style="color:var(--faint)">– –</span></div>`;
      const past = s < NOW.date ? " past" : "", today = (s === NOW.date ? " today" : "") + (isElectionDay(dd) ? " election" : "");
      const tag = topTag(dd);
      const lb = dayLabel(dd);
      return `<button class="tile ${tileClass(dd)}${past}${today}" data-d="${s}" aria-label="${dow(s)} ${short(s)}: ${esc(dayHeadline(dd))}">${tag ? `<span class="tag">${esc(tag)}</span>` : ""}<span class="dn">${D(s).getUTCDate()}</span><span><span class="lb${lb.length > 6 ? " small" : ""}">${esc(lb)}</span><span class="win">${esc(dd.opex ? "1:1 · no partials" : winText(dd))}</span></span>${asiaBadge(s)}</button>`;
    }).join("");
    $("view").innerHTML = `<section class="panel cal">
      <div class="calhead"><h2>${MON[m]}</h2><div class="counts">${counts}</div></div>
      <div class="dow"><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span></div>
      <div class="grid5">${tiles}</div>
      <div class="legend"><span class="s2">Great</span><span class="s1">Good</span><span class="s0">OK</span><span class="s-1">Light</span><span class="s-2">Sit out</span><span class="shol">Holiday</span><span class="shalf">Half day</span><span style="background:var(--panel-2);display:inline-flex;align-items:center;gap:6px"><i class="a8" style="position:static;box-shadow:none">8</i>8 PM Asia good</span></div>
      <p class="notes" style="padding:10px 4px 0">Tap a day to open it. Press and hold for the reasoning.</p>
    </section>`;
    bindTiles();
  }

  /* ---------- week ---------- */
  function renderWeek(){
    const mon = monday(cursor);
    const ds = [0,1,2,3,4].map(i => addDays(mon, i));
    $("title").textContent = short(ds[0]) + " – " + short(ds[4]);
    const tiles = ds.map(s => {
      const dd = BY[s];

      const tag = topTag(dd);

    }).join("");

    <section class="panel tl" id="tl" ${expanded ? "" : "hidden"}></section>`;
    bindTiles();

  }

  /* ---------- day ---------- */
  function renderDay(){
    const s = cursor, dd = BY[s];
    $("title").textContent = dow(s).slice(0,3) + ", " + short(s) + " " + D(s).getUTCFullYear();
    if (!dd) { $("view").innerHTML = `<section class="panel err">No schedule for this day yet. New weeks are added every Sunday.</section>`; return; }
    const lb = dayHeadline(dd);
    const news = dd.news.length ? dd.news.map(n => `<li><span class="t">${esc(n.time)}</span><span class="ip" style="background:${n.impact === "red" ? "#ef5b61" : "#e7ac36"}"></span><span>${esc(n.name)}</span></li>`).join("") : `<li>No scheduled news</li>`;
    const wins = dd.segs.filter(x => !(x[2] === "r" && toMin(x[1]) <= T8)).map(([a,b,k,n]) => `<li data-seg="${s}|${toMin(a)}|${toMin(b)}|${k}" data-reason="${esc(n)}" style="cursor:pointer"><span class="t ${k}">${fmtR(toMin(a), toMin(b))}</span><span>${esc(n)}</span></li>`).join("");
    $("view").innerHTML = `<section class="daybox ${tileClass(dd)}${s === NOW.date ? " today" : ""}">
        <div class="row1"><h3>${esc(lb)}</h3><span class="dt">${dow(s)} ${D(s).getUTCDate()}</span></div>
        <p class="why">${esc(dd.why)}</p>
      </section>
      <section class="panel"><ul class="windows"><li style="grid-template-columns:1fr;font-weight:800;font-size:.8rem;letter-spacing:.1em;color:var(--muted)">NEWS</li>${news.replace(/<li>/g,'<li style="grid-template-columns:auto auto 1fr;display:grid">')}</ul></section>
      ${expanded ? "" : `<section class="panel"><ul class="windows"><li style="grid-template-columns:1fr;font-weight:800;font-size:.8rem;letter-spacing:.1em;color:var(--muted)">WHEN TO TRADE</li>${wins}</ul></section>`}
      ${dd.notes && dd.notes.length ? `<p class="notes">${dd.notes.map(esc).join(" · ")}</p>` : ""}
      <button class="expand" id="exp" aria-expanded="${expanded}">${expanded ? "Hide hours" : "Expand hours"} <span class="chev">&#9662;</span></button>
      <section class="panel tl" id="tl" ${expanded ? "" : "hidden"}></section>`;
    $("view").style.display = "flex"; $("view").style.flexDirection = "column"; $("view").style.gap = "12px";
    $("exp").onclick = () => { setExpanded(!expanded); renderDay(); };
    bindSegs($("view"));
    if (expanded) dayBlocks($("tl"), s);
  }

  /* ---------- day: compact hour blocks ---------- */
  const fmtHM = m => Math.floor(m/60) + ":" + String(m%60).padStart(2,"0");
  const clock = m => { let h = Math.floor(m/60) % 24; const mm = String(m%60).padStart(2,"0"); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return { t: h + ":" + mm, ap }; };
  const rangeLong = (A, B) => { const a = clock(A), b = clock(B); return a.ap === b.ap ? `${a.t} – ${b.t} <small>${b.ap}</small>` : `${a.t} <small>${a.ap}</small> – ${b.t} <small>${b.ap}</small>`; };
  function asiaNow(s, A, B){
    if (NOW.date === addDays(s, -1)) return NOW.min >= A && NOW.min < B;
    if (NOW.date === s) return NOW.min + 1440 >= A && NOW.min + 1440 < B;
    return false;
  }
  function blockRow(A, B, k, n, ms, nowIn, s){
    const h = Math.round(Math.min(170, Math.max(0, (B - A) * 0.9)));
    const c = clock(A);
    return `<div class="drow"><span class="dtime">${c.t}<small>${c.ap}</small></span><div class="dbox ${k}${nowIn ? " live" : ""}" role="button" tabindex="0" data-seg="${s}|${A}|${B}|${k}" data-reason="${esc(n)}" style="min-height:${h}px">
        <div class="dtop"><span class="drng">${rangeLong(A, B)}</span><span class="dst">${k === "g" ? "Trade" : k === "y" ? "Risky" : "No trade"}${nowIn ? " · now" : ""}</span></div>
        <span class="dre">${esc(n)}</span>${ms ? `<span class="dms">${ms}</span>` : ""}</div></div>`;
  }
  function dayBlocks(host, s){
    const dd = BY[s];
    const marks = (dd.marks || []).slice();
    if (dd.holidayType !== "closed" && dd.segs.some(x => x[2] !== "r")) { marks.push(["10:00","10am reversal","time"]); if (!dd.holiday) marks.push(["14:36","2:36 liquidity run","time"]); }
    marks.sort((x, y) => toMin(x[0]) - toMin(y[0]));
    const firstNews = Math.min(...(dd.marks || []).map(m => toMin(m[0])), 9999);
    const S = firstNews < 510 ? Math.floor((firstNews - 10) / 5) * 5 : 510;
    const segs = dd.segs.filter(x => toMin(x[1]) > S).map(x => [fmtHM(Math.max(toMin(x[0]), S)), x[1], x[2], x[3]]);
    let html = `<div class="dsec">New York · ${dow(s)} ${short(s)}</div>`;
    html += segs.map(([a,b,k,n]) => {
      const A = toMin(a), B = toMin(b);
      const ms = marks.filter(m => { const t = toMin(m[0]); return t >= A && t < B; })
        .map(m => `<span class="chipm ${m[2]}">${m[2] === "time" ? "" : esc(m[0]) + " "}${esc(m[1])}</span>`).join("");
      return blockRow(A, B, k, n, ms, s === NOW.date && NOW.min >= A && NOW.min < B, s);
    }).join("");
    const end = clock(toMin(segs.length ? segs[segs.length-1][1] : "16:00"));
    html += `<div class="drow dend"><span class="dtime">${end.t}<small>${end.ap}</small></span><span class="dendl">New York session ends</span></div>`;
    // Asia session that follows this day (belongs to the next trading day)
    let nd = addDays(s, 1);
    for (let i = 0; i < 4 && !BY[nd]; i++) nd = addDays(nd, 1);
    const ndd = BY[nd];
    if (ndd && ndd.asia && ndd.asia.length) {
      html += `<div class="dsec">Overnight · Asia &amp; London → ${dow(nd).slice(0,3)} ${short(nd)}</div>`;
      html += ndd.asia.map(([a,b,k,n]) => blockRow(toMin(a), toMin(b), k, n, toMin(a) === 1560 ? `<span class="chipm time">3:15–3:45 macro</span>` : "", asiaNow(nd, toMin(a), toMin(b)), nd)).join("");
      const ae = clock(toMin(ndd.asia[ndd.asia.length-1][1]));
      html += `<div class="drow dend"><span class="dtime">${ae.t}<small>${ae.ap}</small></span><span class="dendl">London kill zone ends</span></div>`;
    }
    host.innerHTML = `<div class="dlist">${html}</div>`;
    bindSegs(host);
  }

  /* ---------- vertical hour timeline ---------- */
  function timeline(host, dates, colmin){
    const PRE = 56, PX = 1.55;
    const y = m => m <= T8 ? (m - T0) / (T8 - T0) * PRE : PRE + (m - T8) * PX;
    const H = y(T1);
    const g = document.createElement("div"); g.className = "tgrid";
    g.style.setProperty("--cols", dates.length); g.style.setProperty("--colmin", colmin + "px");
    g.appendChild(Object.assign(document.createElement("div"), {className:"th"}));
    dates.forEach(s => { const h = document.createElement("div"); h.className = "th" + (s === NOW.date ? " today" : ""); h.innerHTML = `${dow(s).slice(0,3)}<small>${short(s)}</small>`; g.appendChild(h); });
    const ax = document.createElement("div"); ax.className = "axis"; ax.style.height = H + "px";
    const tick = (m, t, c) => { const e = document.createElement("span"); e.style.top = Math.min(Math.max(y(m),7),H-7) + "px"; e.textContent = t; if (c) e.className = c; ax.appendChild(e); };
    const hr = m => { const h = Math.floor(m/60); return (h % 12 || 12) + (h >= 12 ? " PM" : " AM"); };
    tick(T0,"2 AM"); tick(300,"5 AM"); for (let m = T8; m <= T1; m += 60) tick(m, hr(m)); tick(570,"9:30","o");
    g.appendChild(ax);
    dates.forEach(s => {
      const dd = BY[s];
      const c = document.createElement("div"); c.className = "colx"; c.style.height = H + "px";
      c.insertAdjacentHTML("beforeend", `<div class="pre" style="height:${PRE}px"></div>`);
      for (let m = T8+60; m < T1; m += 60) c.insertAdjacentHTML("beforeend", `<div class="hl" style="top:${y(m)}px"></div>`);
      c.insertAdjacentHTML("beforeend", `<div class="hl o" style="top:${y(570)}px"></div>`);
      dd.segs.forEach(([a,b,k,n]) => {
        const A = toMin(a), B = toMin(b), top = y(A), ht = y(B) - top;
        c.insertAdjacentHTML("beforeend", `<div data-seg="${s}|${A}|${B}|${k}" data-reason="${esc(n)}" class="sg ${k}${ht < 32 ? " tiny" : ""}${ht < 13 ? " micro" : ""}" style="top:${top+1}px;height:${Math.max(ht-2,3)}px" title="${fmtR(A,B)} · ${esc(n)}"><span class="st">${fmtR(A,B)}</span><span class="sn">${esc(n)}</span></div>`);
      });
      (dd.marks || []).forEach(([t,l,k]) => c.insertAdjacentHTML("beforeend", `<div class="mk ${k === "minor" ? "minor" : ""}" style="top:${y(toMin(t))}px"><b>${esc(l)}</b></div>`));
      if (dd.holidayType !== "closed" && !dd.segs.every(x => x[2] === "r")) c.insertAdjacentHTML("beforeend", `<div class="mk time" style="top:${y(600)}px"><b>10am rev</b></div>`);
      if (s === NOW.date && NOW.min >= T0 && NOW.min <= T1) c.insertAdjacentHTML("beforeend", `<div class="nl" style="top:${y(NOW.min)}px"></div>`);
      g.appendChild(c);
    });
    host.innerHTML = ""; host.appendChild(g); bindSegs(host);
  }

  /* ================= desktop ================= */
  const DESK = () => window.matchMedia("(min-width:1100px)").matches;
  const C = { g: "var(--go-c)", y: "var(--warn-c)", r: "var(--stop-c)" };
  function winText(dd){
    if (dd.holidayType === "closed") return "No trading today";
    const g = dd.segs.filter(x => x[2] === "g").map(x => fmtR(toMin(x[0]), toMin(x[1])));
    return g.length ? "Trade " + g.join(", ") : "No green window";
  }
  const hr12 = m => { const h = Math.floor(m/60) % 24; return (h % 12 || 12) + (h >= 12 ? " PM" : " AM"); };

  function deskGrid(host, dates){
    const firstNews = Math.min(9999, ...dates.map(s => Math.min(9999, ...(BY[s]?.marks || []).map(m => toMin(m[0])))));
    // Day fills the screen down to 4 PM; scrolling down continues into that evening's Asia session (to 2 AM),
    // scrolling up shows that morning's London session (from 2 AM)
    const S0 = firstNews < 510 ? Math.floor((firstNews - 10) / 5) * 5 : 510, S1 = 1560, G0 = 120;
    const head = `<div class="wg-head" style="--cols:${dates.length}"><span class="wg-tz">New York</span>${dates.map(s => {
      const dd = BY[s]; const lb = dd ? dayLabel(dd) : "No data";
      return `<button class="wg-dh${s === NOW.date ? " today" : ""}" data-day="${s}"><span class="d1">${D(s).getUTCDate()}<small>${dow(s)}${dd?.opex ? " · "+(dd.expiryLabel||"OPEX") : ""}</small></span>${dd ? `<span class="gp ${tileClass(dd)}">${esc(lb)}</span>` : ""}</button>`;
    }).join("")}</div>`;
    host.innerHTML = `<div class="wg">${head}<div class="wg-body"><div class="wg-grid" style="--cols:${dates.length}"></div></div></div>`;
    const body = host.querySelector(".wg-body"), grid = host.querySelector(".wg-grid");
    const avail = Math.max(420, body.clientHeight - 4);
    const PX = Math.max(1.05, avail / (T1 - S0));
    const H = (S1 - G0) * PX, Y = m => (m - G0) * PX;
    let ax = `<div class="wg-ax" style="height:${H}px">`;
    for (let m = G0; m <= S1; m += 60) ax += `<span style="top:${Math.min(Math.max(Y(m),8),H-8)}px">${hr12(m)}</span>`;
    if (S0 % 60) ax += `<span style="top:${Y(S0)}px">${fmtR(S0,S0).split("–")[0].replace("a"," AM")}</span>`;
    ax += `<span class="o" style="top:${Y(570)}px">9:30</span></div>`;
    let cols = "";
    dates.forEach(s => {
      const dd = BY[s];
      let c = `<div class="wg-col" style="height:${H}px">`;
      for (let m = G0; m <= S1; m += 60) c += `<div class="wg-line" style="top:${Y(m)}px"></div>`;
      c += `<div class="wg-line o" style="top:${Y(570)}px"></div>`;
      // Morning before this day's New York session: London (stored with the day's overnight block as 26:00–29:00)
      const off = (A, B, txt) => { if (Y(B) - Y(A) < 8) return; c += `<div class="wb off${Y(B) - Y(A) < 50 ? " sm" : ""}" style="top:${Y(A) + 2}px;height:${Y(B) - Y(A) - 4}px"><span class="wt">${fmtR(A,B)}</span><span class="wr">${esc(txt)}</span></div>`; };
      const lon = (dd && dd.asia || []).filter(x => toMin(x[0]) >= 1560);
      if (lon.length) {
        lon.forEach(([a,b,k,n]) => {
          const A = toMin(a) - 1440, B = Math.min(toMin(b) - 1440, S0); if (B <= A) return;
          const h = Y(B) - Y(A) - 4, size = h < 26 ? " xs" : h < 50 ? " sm" : "";
          const ms = A === 120 ? `<span class="chipm time">3:15 macro</span>` : "";
          c += `<div class="wb ${k} asia${size}" style="top:${Y(A) + 2}px;height:${Math.max(h,6)}px" data-seg="${s}|${A + 1440}|${toMin(b)}|${k}" data-reason="${esc(n)}" title="${fmtR(A,B)} · ${esc(n)}">
            <span class="wt">${fmtR(A,B)}</span><span class="wr">${esc(n)}</span>${ms ? `<span class="wc">${ms}</span>` : ""}</div>`;
        });
        off(Math.min(toMin(lon[lon.length - 1][1]) - 1440, S0), S0, "London ends · New York next");
      } else off(G0, S0, "No London session");
      if (dd) {
        const marks = (dd.marks || []).slice();
        if (dd.holidayType !== "closed" && dd.segs.some(x => x[2] !== "r")) { marks.push(["10:00","10am reversal","time"]); if (!dd.holiday) marks.push(["14:36","2:36 liquidity run","time"]); }
        dd.segs.forEach(([a,b,k,n]) => {
          const A = Math.max(toMin(a), S0), B = Math.min(toMin(b), S1); if (B <= A) return;
          const top = Y(A) + 2, h = Y(B) - Y(A) - 4;
          const size = h < 26 ? " xs" : h < 50 ? " sm" : "";
          const ms = h >= 74 ? marks.filter(m => { const t = toMin(m[0]); return t >= A && t < B; }).map(m => `<span class="chipm ${m[2]}">${m[2] === "time" ? "" : esc(m[0]) + " "}${esc(m[1])}</span>`).join("") : "";
          c += `<div class="wb ${k}${size}" style="top:${top}px;height:${Math.max(h,6)}px" data-seg="${s}|${A}|${B}|${k}" data-reason="${esc(n)}" title="${fmtR(A,B)} · ${esc(n)}">
            <span class="wt">${fmtR(A,B)}</span><span class="wr">${esc(n)}</span>${ms ? `<span class="wc">${ms}</span>` : ""}</div>`;
        });
        if (s === NOW.date && NOW.min >= G0) c += `<div class="wg-now" style="top:${Y(NOW.min)}px"></div>`;
      }
      // Evening after this day: the next trading day's Asia session
      const nd = addDays(s, 1), ndd = BY[nd];
      if (ndd && ndd.asia && ndd.asia.length) {
        off(T1, toMin(ndd.asia[0][0]), "Close · Asia opens " + hr12(toMin(ndd.asia[0][0])) + " → " + dow(nd).slice(0,3));
        ndd.asia.forEach(([a,b,k,n]) => {
          const A = toMin(a), B = Math.min(toMin(b), S1); if (B <= A) return;
          const h = Y(B) - Y(A) - 4, size = h < 26 ? " xs" : h < 50 ? " sm" : "";
          const ms = A === 1560 ? `<span class="chipm time">3:15 macro</span>` : "";
          c += `<div class="wb ${k} asia${size}" style="top:${Y(A) + 2}px;height:${Math.max(h,6)}px" data-seg="${nd}|${A}|${B}|${k}" data-reason="${esc(n)}" title="${fmtR(A,B)} · ${esc(n)}">
            <span class="wt">${fmtR(A,B)}</span><span class="wr">${esc(n)}</span>${ms ? `<span class="wc">${ms}</span>` : ""}</div>`;
        });
      } else off(T1, S1, D(s).getUTCDay() === 5 ? "Weekend · market closed" : "No overnight session");
      if (addDays(NOW.date, -1) === s && NOW.min < S1 - 1440) c += `<div class="wg-now" style="top:${Y(NOW.min + 1440)}px"></div>`;
      cols += c + "</div>";
    });
    grid.innerHTML = ax + cols;
    // Open on the New York session; London sits above it (scroll up). During London hours, open on London instead.
    body.scrollTop = dates.includes(NOW.date) && NOW.min >= G0 && NOW.min < S0 ? Math.max(0, Y(NOW.min) - 60) : Y(S0);
    host.querySelectorAll(".wg-dh[data-day]").forEach(b => b.onclick = () => { cursor = b.dataset.day; view = "day"; render(); });
    bindSegs(host);
  }

  function renderWeekDesk(){
    const mon = monday(cursor);
    const ds = [0,1,2,3,4].map(i => addDays(mon, i));
    $("title").textContent = MON[D(ds[0]).getUTCMonth()] + ", " + D(ds[0]).getUTCFullYear() + " · " + short(ds[0]) + " – " + short(ds[4]);
    $("view").innerHTML = ""; deskGrid($("view"), ds);
  }

  function renderDayDesk(){
    const s = cursor, dd = BY[s];
    $("title").textContent = dow(s).slice(0,3) + ", " + short(s) + " " + D(s).getUTCFullYear();
    if (!dd) { $("view").innerHTML = `<section class="panel err">No schedule for this day yet. New weeks are added every Sunday.</section>`; return; }
    const lb = dayHeadline(dd);
    let nd = addDays(s, 1); for (let i = 0; i < 4 && !BY[nd]; i++) nd = addDays(nd, 1);
    const ov = (BY[nd]?.asia || []).map(([a,b,k,n]) => `<div class="ovr ${k}" data-seg="${nd}|${toMin(a)}|${toMin(b)}|${k}" data-reason="${esc(n)}"><span class="t">${fmtR(toMin(a), toMin(b))}</span><span>${esc(n)}</span></div>`).join("");
    const news = dd.news.length ? dd.news.map(n => `<li style="display:grid;grid-template-columns:auto auto 1fr"><span class="t">${esc(n.time)}</span><span class="ip" style="background:${n.impact === "red" ? "#ef5b61" : "#e7ac36"}"></span><span>${esc(n.name)}</span></li>`).join("") : `<li>No scheduled news</li>`;
    $("view").innerHTML = `<div class="dd-wrap"><div id="ddg" style="display:flex;min-height:0;min-width:0"></div>
      <div class="dd-side">
        <section class="daybox ${tileClass(dd)}"><div class="row1"><h3>${esc(lb)}</h3><span class="dt">${dow(s)} ${D(s).getUTCDate()}</span></div><p class="why">${esc(dd.why)}</p></section>
        <section class="panel"><ul class="windows"><li style="grid-template-columns:1fr;font-weight:800;font-size:.8rem;letter-spacing:.1em;color:var(--muted)">NEWS</li>${news}</ul></section>
        ${weekRed(s)}
        ${ov ? `<section class="panel ov"><h4>Overnight · Asia &amp; London → ${dow(nd).slice(0,3)} ${short(nd)}</h4>${ov}</section>` : ""}
        ${dd.notes && dd.notes.length ? `<p class="notes">${dd.notes.map(esc).join(" · ")}</p>` : ""}
      </div></div>`;
    deskGrid($("ddg"), [s]);
    bindSegs($("view").querySelector(".dd-side"));
    $("view").querySelectorAll(".wkd[data-d]").forEach(b => b.onclick = () => { cursor = b.dataset.d; render(); });
  }

  /* ---------- red folder news ---------- */
  const FOLD = `<svg viewBox="0 0 16 13" aria-hidden="true"><path fill="currentColor" d="M1 2.5A1.5 1.5 0 0 1 2.5 1h3.4l1.6 1.6h6A1.5 1.5 0 0 1 15 4.1v6.9a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 11z"/></svg>`;
  const fold = imp => FOLD.replace("<svg", `<svg class="fold ${imp}"`);
  const weekDays = s => { const mon = monday(s); return [0,1,2,3,4].map(i => addDays(mon, i)); };
  const reds = s => (BY[s]?.news || []).filter(n => n.impact === "red");
  // the week's red folder, Mon–Fri, shown beside the day schedule
  function weekRed(s){
    const rows = weekDays(s).map(d => {
      const r = reds(d);
      const items = r.length ? `<ul>${r.map(n => `<li>${fold("red")}<span class="tm">${fmt(toMin(n.time))}</span><span>${esc(n.name)}</span></li>`).join("")}</ul>` : `<span class="none">No red folder</span>`;
      return `<button class="wkd${d === s ? " cur" : ""}" data-d="${d}"><span class="dl">${dow(d).slice(0,3)}<small>${short(d)}</small></span>${items}</button>`;
    }).join("");
    return `<section class="panel wkred"><h4>Red folder this week</h4>${rows}</section>`;
  }

  /* ---------- week news list ---------- */
  function renderList(){
    const ds = weekDays(cursor);
    $("title").textContent = "News · " + short(ds[0]) + " – " + short(ds[4]);
    let nextFound = false;
    const days = ds.map(s => {
      const dd = BY[s];
      const lb = dd ? dayLabel(dd) : "";
      const head = `<div class="nlhead" data-d="${s}"><span class="dd">${dow(s).slice(0,3)}<small>${short(s)}</small></span>${dd ? `<span class="gp ${tileClass(dd)}">${esc(dayHeadline(dd))}</span><span class="tw">${esc(dd.opex ? "1:1 · no partials" : winText(dd))}</span>` : ""}</div>`;
      if (!dd) return `<section class="nlday">${head}<div class="nlempty">No schedule for this week yet. New weeks are added every Sunday.</div></section>`;
      const items = dd.news.slice().sort((a, b) => toMin(a.time) - toMin(b.time)).map(n => {
        const past = s < NOW.date || (s === NOW.date && toMin(n.time) < NOW.min);
        const isNext = !past && !nextFound && (nextFound = true);
        const est = /\(est\.\)/.test(n.name);
        return `<div class="nlrow${past ? " past" : ""}${isNext ? " next" : ""}"><span class="tm">${fmt(toMin(n.time))}</span>${fold(n.impact)}<span>${esc(n.name.replace(/\s*\(est\.\)/, ""))}${est ? `<span class="est">est.</span>` : ""}</span><span class="im ${n.impact}">${n.impact === "red" ? "High" : "Medium"}</span></div>`;
      }).join("");
      return `<section class="nlday${s === NOW.date ? " today" : ""}">${head}${items || `<div class="nlempty">No scheduled news</div>`}</section>`;
    }).join("");
    $("view").innerHTML = `<div class="nlist">${days}</div>`;
    $("view").querySelectorAll(".nlhead[data-d]").forEach(h => h.onclick = () => { cursor = h.dataset.d; view = "day"; listMode = false; render(); });
  }

  let miniMonth = null; // "YYYY-MM-01" while browsing with the arrows; null follows the cursor
  function renderMini(){
    const d = D(miniMonth || cursor); const y = d.getUTCFullYear(), m = d.getUTCMonth();
    const first = new Date(Date.UTC(y, m, 1, 12)); const start = addDays(iso(first), -((first.getUTCDay() + 6) % 7));
    const curWeek = view === "week" || listMode ? monday(cursor) : "";
    let cells = `<span class="h"></span>` + ["M","T","W","T","F","S","S"].map((h,i) => `<span class="h${i > 4 ? " we" : ""}">${h}</span>`).join("");
    for (let i = 0; i < 42; i++) {
      const s = addDays(start, i), dd = BY[s], wd = D(s).getUTCDay(), inM = D(s).getUTCMonth() === m;
      if (i >= 35 && !inM) break;
      if (i % 7 === 0) cells += `<button class="wkb${s === curWeek ? " on" : ""}" data-w="${s}" title="Week of ${short(s)}" aria-label="Open week of ${short(s)}">&#9656;</button>`;
      const dot = dd && inM ? `<i style="background:${dd.holidayType && dd.holidayType !== "half" ? "#7b6cf6" : dd.score >= 1 ? "#26c48d" : dd.score === 0 ? "#8cc4b0" : dd.score === -1 ? "#e7ac36" : "#ef5b61"}"></i>` : "";
      const cls = ["md", !inM ? "out" : "", (wd === 0 || wd === 6) ? "we" : "", s === cursor ? "sel" : "", s === NOW.date ? "today" : "", dd ? "click" : ""].filter(Boolean).join(" ");
      cells += `<span class="${cls}" ${dd ? `data-d="${s}" role="button" tabindex="0"` : ""}>${D(s).getUTCDate()}${dot}</span>`;
    }
    $("mini").innerHTML = `<h3><span>${MON[m]} ${y}</span><span class="mnav"><button class="arrow" data-m="-1" aria-label="Previous month">&#8249;</button><button class="arrow" data-m="1" aria-label="Next month">&#8250;</button></span></h3><div class="mgrid wk">${cells}</div>`;
    $("mini").querySelectorAll("[data-m]").forEach(b => b.onclick = () => { const t = D(iso(first)); t.setUTCMonth(t.getUTCMonth() + Number(b.dataset.m)); miniMonth = iso(t); renderMini(); });
    $("mini").querySelectorAll("[data-d]").forEach(e => e.onclick = () => { cursor = e.dataset.d; view = "day"; listMode = false; render(); });
    $("mini").querySelectorAll("[data-w]").forEach(e => e.onclick = () => { cursor = e.dataset.w; if (!listMode) view = "week"; render(); });
  }

  function renderBrk(){
    const d = D(cursor); const m = d.getUTCMonth(), y = d.getUTCFullYear();
    const days = Object.values(BY).filter(x => { const t = D(x.date); return t.getUTCMonth() === m && t.getUTCFullYear() === y; });
    const k = dayLabel;
    const rows = [["Great","#12a77f"],["Good","#26c48d"],["OK","#8cc4b0"],["Light","#e7ac36"],["Sit out","#ef5b61"],["Markets open","#7b6cf6"],["Markets closed","#4a4f5c"]];
    const n = days.length || 1;
    $("brk").innerHTML = `<h3>${MON[m]} breakdown</h3>` + rows.map(([lab, col]) => {
      const c = days.filter(x => k(x) === lab).length;
      return `<div class="brow"><span class="bd" style="background:${col}"></span><span>${lab}</span><span class="bt"><b style="width:${c / n * 100}%;background:${col}"></b></span><span class="bn">${c}</span></div>`;
    }).join("");
  }

  function renderUpcoming(){
    // every upcoming red folder release: one card per day, split by week
    let html = "", lastWeek = "";
    const thisWeek = monday(NOW.date);
    Object.values(BY).filter(x => x.date >= NOW.date).sort((a,b) => a.date < b.date ? -1 : 1).forEach(x => {
      const r = reds(x.date).filter(n => !(x.date === NOW.date && toMin(n.time) < NOW.min));
      if (!r.length) return;
      const wk = monday(x.date);
      if (wk !== lastWeek) {
        lastWeek = wk;
        html += `<div class="upw">${wk === thisWeek ? "This week" : wk === addDays(thisWeek, 7) ? "Next week" : "Week of " + short(wk)}</div>`;
      }
      const rel = x.date === NOW.date ? "Today" : x.date === addDays(NOW.date, 1) ? "Tomorrow" : "";
      const edge = x.holidayType && x.holidayType !== "half" ? "#7b6cf6" : x.score >= 2 ? "#12a77f" : x.score === 1 ? "#26c48d" : x.score === 0 ? "#8cc4b0" : x.score === -1 ? "#e7ac36" : "#ef5b61";
      html += `<button class="upc${x.date === NOW.date ? " now" : ""}" style="border-left-color:${edge}" data-d="${x.date}" title="${esc(x.label)} day">
        <span class="upc-d"><b>${dow(x.date).slice(0,3)}</b><span>${short(x.date)}</span>${rel ? `<i>${rel}</i>` : ""}</span>
        <span class="upc-l">${r.map(n => `<span class="upr">${fold("red")}<span class="tm">${fmt(toMin(n.time))}</span><span>${esc(n.name)}</span></span>`).join("")}</span></button>`;
    });
    $("upn").innerHTML = `<h3>Upcoming red folder</h3>` + (html ? `<div class="upl">${html}</div>` : `<p class="notes">Nothing scheduled.</p>`);
    $("upn").querySelectorAll("[data-d]").forEach(e => e.onclick = () => { cursor = e.dataset.d; view = "day"; render(); });
  }

  function render(){
    applyMarketConditions();$("condition-host").innerHTML=marketConditionCard();bindMarketConditions();
    $("sheet").hidden = true; miniMonth = null;
    ["month","week","day"].forEach(v => $("v-" + v).setAttribute("aria-pressed", String(!listMode && v === view)));
    $("lst").setAttribute("aria-pressed", String(listMode));
    $("lst").textContent = listMode ? "Show schedule" : "Show list";
    $("view").removeAttribute("style");
    const dk = DESK();
    if (listMode) renderList();
    else if (view === "month") renderMonth(); else if (view === "week") (dk ? renderWeekDesk : renderWeek)(); else (dk ? renderDayDesk : renderDay)();
    if (dk) { renderMini(); renderBrk(); renderUpcoming(); if (view === "month" && !listMode) $("title").textContent = MON[D(cursor).getUTCMonth()] + ", " + D(cursor).getUTCFullYear(); }
    if (!dk && view !== "day") { $("view").style.display = "flex"; $("view").style.flexDirection = "column"; $("view").style.gap = "12px"; }
    renderNow(); writeHash();
  }

  Promise.all([fetch("data.json", {cache: "no-store"}).then(r => {if(!r.ok)throw new Error('Schedule unavailable');return r.json();}), fetch("market-conditions.json", {cache:"no-store"}).then(r=>{if(!r.ok)throw new Error('Recordings unavailable');return r.json();}).then(d=>{if(d.version!==1||!d.days)throw new Error('Invalid recordings');AUTO_CONDITIONS=d;autoRecordingStatus="No automatic snapshot recorded for this date yet.";}).catch(()=>{autoRecordingStatus="Daily recordings could not load. Missing values remain unknown.";})]).then(([d]) => {
    DATA = d; d.days.forEach(x => BY[x.date] = x);
    // rulebook: consumer sentiment counts as red folder even when the calendar shows it orange
    d.days.forEach(x => x.news.forEach(n => { if (/sentiment|consumer confidence/i.test(n.name)) n.impact = "red"; }));
    $("upd").textContent = "Updated " + short(d.updated);
    $("foot").innerHTML = `<p>All times New York. Green = good to trade · yellow = risky / light size · red = don't trade.</p><p>Calendar sources: ${d.sources.map(esc).join(", ")}. Dates marked "est." are confirmed each Sunday.</p>`;
    marketBase=Object.fromEntries(d.days.map(x=>[x.date,JSON.parse(JSON.stringify(x))]));readHash(); render();
    setInterval(() => { NOW = nyNow(); renderNow(); }, 60000);
  }).catch(() => { $("view").innerHTML = `<section class="panel err">Couldn't load the schedule. Check your connection and reload.</section>`; });
  window.addEventListener("hashchange", () => { readHash(); render(); });
  let rz, lastW = innerWidth; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (DATA && (innerWidth !== lastW || DESK())) { lastW = innerWidth; render(); } }, 150); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") $("sheet").hidden = true; else if (e.key === "ArrowLeft" && !e.target.closest("input")) step(-1); else if (e.key === "ArrowRight" && !e.target.closest("input")) step(1); });
})();
</script>
</body>
</html>
