# Cloud recorder: runs the same collector as the PC task, commits market-conditions.json,
# and Vercel deploys the push. GitHub cron is UTC and can start a few minutes late;
# 11:07-22:37 UTC is 6:07 AM-5:37 PM New York in EST and 7:07 AM-6:37 PM in EDT.
# Minutes 7 and 37 avoid the top/half hour, when GitHub drops or delays scheduled runs.
name: Record market conditions

on:
  schedule:
    - cron: "7,37 11-22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: record-market-conditions
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and merge into the archive
        run: python collect_market_conditions.py

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet -- market-conditions.json; then
            echo "No change to record"; exit 0
          fi
          # Vercel only deploys commits from the account owner, so commit as him.
          git config user.name "kaidsalem48-ui"
          git config user.email "kaidsalem48@gmail.com"
          git add market-conditions.json
          git commit -m "Record sourced market conditions for $(TZ=America/New_York date +%F) (cloud)"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
