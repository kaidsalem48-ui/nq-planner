# One-off cloud recording (manual "Run workflow" button, plus a backup schedule).
# The real schedule is recorder-loop.yml, because GitHub's cron barely fires for this repo.
name: Record market conditions

on:
  schedule:
    - cron: "7,37 11-22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: record-market-conditions
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record, notify, commit
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash scripts/record-once.sh
